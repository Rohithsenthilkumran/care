<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cart – CARE: Because We Care</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="cart">
<main id="main">
<div class="page-head"><div class="wrap"><h1>🛒 Your Cart</h1><p>Check your services, then press Proceed to Book.</p></div></div>
<section><div class="wrap" id="cartBox"></div></section>
<dialog id="bookDlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle">Confirm your booking</h2>
  <ul id="bkSummary" class="list-clean"></ul>
  <form id="bookForm">
    <label for="bkDate">Preferred date</label><input type="date" id="bkDate" required>
    <label for="bkTime">Preferred time</label><input type="time" id="bkTime" value="10:00" required>
    <div class="dlg-actions">
      <button type="submit" class="btn">✔ Confirm Booking</button>
      <button type="button" class="btn alt" id="dlgBack">Go Back</button>
    </div>
  </form>
</dialog>
</main>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
