<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us – CARE: Because We Care</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="contact">
<main id="main">
<div class="page-head"><div class="wrap"><h1>Contact Us</h1><p>We would love to hear from you.</p></div></div>
<section><div class="wrap two-col">
  <div>
    <div class="panel">
      <h2>Get in touch</h2>
      <p><strong>Phone:</strong> +91 80000 00000</p>
      <p><strong>Email:</strong> hello@care-hub.com</p>
      <a class="btn" href="tel:+918000000000">📞 Call CARE</a>
      <a class="btn alt" href="https://wa.me/918000000000" target="_blank" rel="noopener">💬 WhatsApp</a>
      <p class="notice" style="margin-top:20px"><strong>Important:</strong> CARE is not an emergency service. In an emergency, please call 112.</p>
    </div>
    <div class="panel" style="margin-top:24px"><h2>CARE Hub locations</h2><ul class="list-clean" id="hubList"></ul></div>
  </div>
  <div class="panel">
    <h2>Send us a message</h2>
    <p id="formMsg" class="notice success" role="status" hidden></p>
    <form id="contactForm">
      <label for="cName">Your name</label><input id="cName" name="name" required autocomplete="name">
      <label for="cPhone">Phone number</label><input id="cPhone" name="phone" type="tel" autocomplete="tel">
      <label for="cMsg">Your message</label><textarea id="cMsg" name="message" rows="5" required></textarea>
      <p></p><button type="submit" class="btn">Send Message</button>
    </form>
  </div>
</div></section>
</main>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
