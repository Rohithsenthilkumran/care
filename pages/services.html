<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services – CARE: Because We Care</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="services">
<main id="main">
<div class="page-head"><div class="wrap"><h1>Our Services</h1><p>Prices are per hour. Elderly assistance: minimum 2 hours. Childcare: minimum 3 hours.</p></div></div>
<section><div class="wrap"><div class="grid" id="serviceGrid"></div></div></section>
<section id="plans" style="background:#fff"><div class="wrap">
  <h2>Monthly Check-In Plans</h2>
  <p>Subscribe once and get scheduled elderly check-ins with family updates every month.</p>
  <div class="grid" id="planGrid"></div>
</div></section>
</main>

<dialog id="bookDlg">
  <h2>Complete Your Booking</h2>
  <form id="bookForm">
    <label for="bkDate">Date</label>
    <input type="date" id="bkDate" name="date" required>
    <label for="bkTime">Time</label>
    <input type="time" id="bkTime" name="time" required min="07:00" max="20:00" value="10:00">
    <p class="notice">Your booking:</p>
    <ul id="bkSummary" class="list-clean"></ul>
    <div class="dlg-actions">
      <button type="button" class="btn alt" id="dlgBack">Back to Cart</button>
      <button type="submit" class="btn">Confirm Booking</button>
    </div>
  </form>
</dialog>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
